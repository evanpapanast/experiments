name: Data quality gate

# Runs the data quality checks on every push and pull request.
# A FAIL-severity check makes this workflow fail, so a bad change is visible before it is relied on.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ai-adoption-eu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-adoption-eu/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - name: Run data quality checks
        run: python 03_data_quality.py
      - name: Publish report to the run summary
        if: always()
        run: cat ../data_quality/dq_report.md >> "$GITHUB_STEP_SUMMARY"

  ecb-speeches:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecb-speeches/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - name: Run data quality checks
        run: python 06_data_quality.py
      - name: Publish report to the run summary
        if: always()
        run: cat ../data_quality/dq_report.md >> "$GITHUB_STEP_SUMMARY"

  liquor-market:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquor-market/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - name: Run data quality checks
        run: python 02_data_quality.py
      - name: Publish report to the run summary
        if: always()
        run: cat ../data_quality/dq_report.md >> "$GITHUB_STEP_SUMMARY"


  monthly-close:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monthly-close/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rerun the close and all checks (fails on any FAIL check)
        run: python close.py
      - name: Fail if report data or governance files differ from what the script produces
        run: |
          git diff --exit-code -- ../dashboard/data.js ../governance/ ../data/close_by_family.csv
      - name: Publish checks to the run summary
        if: always()
        run: cat ../governance/checks.md >> "$GITHUB_STEP_SUMMARY"

  customer-360:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-360/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the dbt project parses and compiles (offline, no BigQuery access, no cost)
        run: |
          pip install --quiet dbt-core dbt-bigquery
          openssl genrsa -out /tmp/k.pem 2048
          python -c "import json; json.dump({'type':'service_account','project_id':'project-57338774-2b06-4ac1-ba9','private_key_id':'offline','private_key':open('/tmp/k.pem').read(),'client_email':'offline@project-57338774-2b06-4ac1-ba9.iam.gserviceaccount.com','client_id':'0','token_uri':'https://oauth2.googleapis.com/token'}, open('/tmp/offline_sa.json','w'))"
          cd ../dbt
          DBT_PROFILES_DIR=. dbt parse
          DBT_PROFILES_DIR=. dbt compile --target offline --no-populate-cache --no-introspect
          python ../scripts/03_dbt_connector_plan.py
      - name: Rebuild report data from the extract
        run: python 01_build_report_data.py
      - name: Fail if report data differs from what the script produces
        run: git diff --exit-code -- ../dashboard/data.js ../data/
      - name: Run data quality checks
        run: python 02_data_quality.py
      - name: Publish report to the run summary
        if: always()
        run: cat ../data_quality/dq_report.md >> "$GITHUB_STEP_SUMMARY"
